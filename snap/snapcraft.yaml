name: vangs-app
version: '1.3.1'
summary: Vangs App — Digital Wardrobe, Fashion Ecosystem & Marketplace
description: |
  Vangs App is the unified fashion platform for cataloging your digital wardrobe,
  styling outfits, connecting across the fashion network, and exploring curated pieces.
  Includes native multi-window workspaces, Wayland/X11 hardware acceleration, and
  instant synchronization across all 11 Vangs App ecosystem hubs.

grade: stable
confinement: strict
base: core22
compression: lzo

architectures:
  - build-on: amd64
    build-for: amd64

apps:
  vangs-app:
    command: opt/vangs-app/vangs-app --no-sandbox
    extensions: [gnome]
    common-id: app.vangs.VangsApp
    plugs:
      - desktop
      - desktop-legacy
      - home
      - x11
      - wayland
      - unity7
      - browser-support
      - network
      - network-bind
      - audio-playback
      - audio-record
      - camera
      - opengl
      - removable-media
      - password-manager-service

parts:
  vangs-app:
    plugin: dump
    source: https://storage.googleapis.com/vangarments-storage/releases/linux/x64/Vangs%20App.tar.gz
    source-type: tar
    source-checksum: sha256/2768a6165c719ba93556d44f1bace63e3889509202e6f2552c0d1cfe0699dc50
    organize:
      'Vangs App': opt/vangs-app/vangs-app
      '*': opt/vangs-app/
    stage-packages:
      - libnss3
      - libnspr4
      - libasound2
      - libgbm1
      - libxss1
      - libxtst6
      - libatspi2.0-0
      - libdrm2
      - libgtk-3-0
      - libnotify4
      - libsecret-1-0

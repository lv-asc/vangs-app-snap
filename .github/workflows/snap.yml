name: Build and Publish Snap & Flatpak
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Snap and Flatpak Bundles
        run: bash ./build-packages.sh
      - name: Upload Flatpak Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vangs-app-flatpak
          path: flatpak/Vangs App.flatpak
